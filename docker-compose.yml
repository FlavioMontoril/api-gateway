services:
  api-gateway:
    build: . # Caminho para a pasta onde está o Dockerfile do Gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8083:8083" # Expõe a porta do Gateway para o ReactJS acessar
    environment:
      FRONTEND_URL: ${FRONTEND_URL}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      AUTH_SOCKET_URL: ${AUTH_SOCKET_URL}
      TASK_SERVICE_URL: ${TASK_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - apache-network

networks:
  apache-network:
    external: true