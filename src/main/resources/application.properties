server.port=8083
spring.application.name=api-gateway

# Configuração Global de CORS do Gateway Reativo
spring.cloud.gateway.globalcors.add-to-config-web-supported=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_URL}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization,Content-Type,X-Requested-With
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# 2. Remove cabeçalhos CORS duplicados enviados pelos microserviços de backend
spring.cloud.gateway.default-filters[0]=DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

# Deduplicação nativa de cabeçalhos de resposta
spring.cloud.gateway.globalcors.cors-configurations.[/**].deduplicate-response-headers=Access-Control-Allow-Origin Access-Control-Allow-Credentials
spring.cloud.gateway.globalcors.cors-configurations.[/**].deduplicate-strategy=RETAIN_FIRST

# Rota HTTP para o Auth Server
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Rota WebSocket para o Auth Server
spring.cloud.gateway.routes[1].id=auth-socket-service
spring.cloud.gateway.routes[1].uri=${AUTH_SOCKET_URL}
spring.cloud.gateway.routes[1].predicates[0]=Path=/ws/**
# 2. Remove cabeçalhos CORS duplicados enviados pelos microserviços de backend
spring.cloud.gateway.default-filters[0]=DeduplicateResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

JWT_SECRET=${JWT_SECRET:suaChaveSecretaSuperSeguraComPeloMenos32CaracteresAqui}

# Ativa logs detalhados de roteamento no Gateway
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.http.server.reactive=DEBUG
logging.level.org.springframework.web.reactive=DEBUG
logging.level.reactor.netty=DEBUG